[Unit]
Requires=telegram-bot-api.service
After=telegram-bot-api.service

[Service]
EnvironmentFile=/etc/zed-whisper-bot/bot.env
Environment=TELEGRAM_LOCAL_MODE=true
Environment=TELEGRAM_BASE_URL=http://127.0.0.1:8081/bot
Environment=TELEGRAM_BASE_FILE_URL=http://127.0.0.1:8081/file/bot
Environment=TELEGRAM_LOCAL_DATA_DIR=/var/lib/telegram-bot-api
